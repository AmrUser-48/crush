name: Debian 12 slim build

on:
  push:
    branches: [debian12-slim]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian12-slim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    name: Linux x86-64 (Core 2 compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Build stripped binary and collect size report
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
          GOEXPERIMENT: greenteagc
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)"

          # Unstripped diagnostic build is kept only in the runner's /tmp.
          go build -mod=readonly -trimpath -buildvcs=false \
            -o /tmp/crush-unstripped .

          # Release binary: no DWARF, symbol table, build ID, or source paths.
          go build -mod=readonly -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X github.com/charmbracelet/crush/internal/version.Version=${VERSION}" \
            -o dist/crush .

          tar -czf "$GITHUB_WORKSPACE/dist/crush-linux-amd64.tar.gz" -C "$GITHUB_WORKSPACE/dist" crush

          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Go: $(go version)"
            echo "Target: linux/amd64, GOAMD64=v1"
            echo "CGO_ENABLED=0"
            echo
            echo "Stripped binary: $(stat -c '%s bytes' dist/crush)"
            echo "Unstripped binary: $(stat -c '%s bytes' /tmp/crush-unstripped)"
            echo "Compressed archive: $(stat -c '%s bytes' dist/crush-linux-amd64.tar.gz)"
            echo
            echo "SHA-256:"
            sha256sum dist/crush dist/crush-linux-amd64.tar.gz
            echo
            echo "ELF:"
            file dist/crush
            echo
            echo "ELF section sizes (NOBITS sections do not occupy file bytes):"
            readelf -SW dist/crush
            echo
            echo "ELF load segments:"
            readelf -lW dist/crush
            echo
            echo "Embedded Go build information:"
            go version -m dist/crush
          } > dist/build-info.txt

          go list -deps -f '{{if .Module}}{{.Module.Path}}{{end}}' . \
            | sort -u > dist/linked-modules.txt

          go tool nm -size /tmp/crush-unstripped \
            | awk '$2 ~ /^[0-9]+$/ { print $2 "\t" $3 "\t" $1 "\t" substr($0, index($0, $4)) }' \
            | sort -nr > /tmp/crush-symbol-sizes.txt
          head -n 100 /tmp/crush-symbol-sizes.txt > dist/largest-symbols.txt
          awk -F '\t' '$2 ~ /^[Tt]$/ { print }' /tmp/crush-symbol-sizes.txt > /tmp/crush-text-symbols.txt
          awk -F '\t' '$2 ~ /^[Rr]$/ { print }' /tmp/crush-symbol-sizes.txt > /tmp/crush-rodata-symbols.txt
          awk -F '\t' '$2 ~ /^[Dd]$/ { print }' /tmp/crush-symbol-sizes.txt > /tmp/crush-data-symbols.txt
          awk -F '\t' '$2 ~ /^[Bb]$/ { print }' /tmp/crush-symbol-sizes.txt > /tmp/crush-bss-symbols.txt
          sed -n '1,80p' /tmp/crush-text-symbols.txt > dist/largest-text-symbols.txt
          sed -n '1,80p' /tmp/crush-rodata-symbols.txt > dist/largest-rodata-symbols.txt
          sed -n '1,80p' /tmp/crush-data-symbols.txt > dist/largest-data-symbols.txt
          sed -n '1,80p' /tmp/crush-bss-symbols.txt > dist/largest-bss-symbols.txt

          {
            echo
            echo "Dependency chains for candidate large modules:"
            for module in \
              github.com/anthropics/anthropic-sdk-go \
              github.com/aws/aws-sdk-go-v2 \
              google.golang.org/genai \
              github.com/go-git/go-git/v5 \
              modernc.org/sqlite \
              github.com/alecthomas/chroma/v2 \
              github.com/itchyny/gojq \
              github.com/disintegration/imaging \
              github.com/andybalholm/brotli \
              github.com/klauspost/compress; do
              echo
              echo "--- $module ---"
              go mod why -m "$module" || true
            done
          } >> dist/build-info.txt

          SIZE="$(stat -c '%s' dist/crush)"
          LIMIT=20000000
          if (( SIZE < LIMIT )); then
            RESULT=PASS
          else
            RESULT=FAIL
            echo "::warning::Stripped binary is ${SIZE} bytes; target is approximately 20 MB (${LIMIT} bytes)."
          fi
          {
            echo "result=${RESULT}"
            echo "actual_bytes=${SIZE}"
            echo "target_bytes=${LIMIT}"
            echo "actual_decimal_MB=$(awk -v n="${SIZE}" 'BEGIN { printf "%.2f", n/1000000 }')"
          } > dist/size-limit.txt

          cat dist/build-info.txt
          echo
          echo "20 MB size target:"
          cat dist/size-limit.txt
          echo
          echo "Largest linked symbols (size, type, address, symbol):"
          cat dist/largest-symbols.txt

      - name: Upload Linux binary and footprint report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crush-debian12-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14
